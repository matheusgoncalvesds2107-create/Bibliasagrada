name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Android e TTS
        run: |
          npm install @capacitor/android@^7.4.3
          npm install @capacitor-community/text-to-speech@^6.1.0

      - name: Baixar Bíblia
        run: |
          curl -L --fail --retry 5 \
            -o public/bible.json \
            https://raw.githubusercontent.com/midvash/bible-data/main/versions/pt/almeida-livre/almeida-livre.json

      - name: Verificar Bíblia
        run: |
          test -s public/bible.json
          echo "Bíblia encontrada:"
          wc -c public/bible.json

      - name: Criar versão web
        run: npm run build

      - name: Criar Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Sagrada-Devocional-Lite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
